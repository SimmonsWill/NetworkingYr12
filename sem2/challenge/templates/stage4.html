<!DOCTYPE html>
<html>
<head>
    <title>Stage 4 - Chain Reaction</title>
</head>
<body>

    <h1>Stage 4: Packet Analysis</h1>

    <p>Download the packet capture file below.</p>

    <p>
        <a href="{{ url_for('static', filename='artifacts/secret.pcap') }}" download>
            Download secret.pcap
        </a>
    </p>

    <p>
        Analyse the network packets using Wireshark.
        Find the destination IP address associated with the login attempt.
    </p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p style="color: green;">{{ success }}</p>
    {% endif %}

    <form action="{{ url_for('stage4_submit') }}" method="POST">

        <label for="answer">Destination IP address:</label>

        <input
            type="text"
            id="answer"
            name="answer"
            placeholder="e.g. 192.0.2.10"
            required
        >

        <button type="submit">Submit Answer</button>

    </form>

</body>
</html>
