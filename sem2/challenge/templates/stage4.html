<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Stage 4</title></head>
<body>
    <h1>Stage 4: Packet Analysis</h1>
    <p>Download the packet capture and open it in Wireshark.</p>
    <p><a href="{{ url_for('static', filename='artifacts/secret.pcap') }}" download>Download secret.pcap</a></p>
    <p>Find the destination IP address associated with the login attempt.</p>
    {% if error %}<p>{{ error }}</p>{% endif %}
    {% if success %}<p>{{ success }}</p>{% endif %}
    <form action="{{ url_for('stage4_submit') }}" method="post">
        <label for="answer">Destination IP address:</label>
        <input type="text" id="answer" name="answer" required>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
