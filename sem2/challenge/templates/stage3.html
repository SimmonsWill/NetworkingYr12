<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Stage 3</title></head>
<body>
    <h1>Stage 3: Image Metadata</h1>
    <p>Download the image and find the location stored in its metadata.</p>
    <p><a href="{{ url_for('static', filename='artifacts/secret.jpg') }}" download>Download secret.jpg</a></p>
    {% if error %}<p>{{ error }}</p>{% endif %}
    <form action="{{ url_for('stage3_submit') }}" method="post">
        <label for="answer">Location:</label>
        <input type="text" id="answer" name="answer" required>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
