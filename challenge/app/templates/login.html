<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRC — Connect</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .terminal {
      width: 420px;
      border: 1px solid #2a2a2a;
      background: #111;
    }

    .terminal-bar {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 10px 14px;
      font-size: 12px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.red   { background: #ff5f56; }
    .dot.yellow{ background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .terminal-body { padding: 28px; }

    .prompt-line {
      color: #27c93f;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .prompt-line span { color: #555; }

    h1 {
      font-size: 20px;
      font-weight: normal;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 12px;
      color: #444;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 11px;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #27c93f; }
    input::placeholder { color: #333; }

    button {
      margin-top: 8px;
      width: 100%;
      background: #27c93f;
      color: #0d0d0d;
      border: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      font-weight: bold;
      padding: 12px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s;
    }

    button:hover { background: #2edb46; }

    .error {
      margin-top: 12px;
      font-size: 12px;
      color: #ff5f56;
      display: none;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="terminal-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <span style="margin-left:6px;">irc-client — connect</span>
    </div>
    <div class="terminal-body">
      <div class="prompt-line">$ <span>./connect.sh</span></div>
      <h1>IRC CHAT</h1>
      <p class="subtitle">Enter a nickname and channel to join.</p>

      <div class="field">
        <label>Nickname</label>
        <input id="nick" type="text" placeholder="e.g. alice" maxlength="20" autocomplete="off" />
      </div>
      <div class="field">
        <label>Channel</label>
        <input id="channel" type="text" placeholder="e.g. general" maxlength="30" autocomplete="off" />
      </div>
      <button onclick="connect()">CONNECT →</button>
      <p class="error" id="error">Please enter a nickname and channel.</p>
    </div>
  </div>

  <script>
    function connect() {
      const nick = document.getElementById('nick').value.trim();
      const channel = document.getElementById('channel').value.trim().replace(/^#/, '');
      const err = document.getElementById('error');

      if (!nick || !channel) {
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';

      // Store in sessionStorage and redirect to chat
      sessionStorage.setItem('nick', nick);
      sessionStorage.setItem('channel', channel);
      window.location.href = '/chat';
    }

    // Allow Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') connect();
    });
  </script>
</body>
</html>
